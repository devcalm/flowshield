[package]
name = "flowshield-core"
version = "1.0.0"
description = "Core traits and types for FlowShield — storage- and framework-agnostic traffic management and rate limiting for Rust."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Packaging allowlist for `cargo publish`.
#
# `include` is an ALLOWLIST and is preferred over `exclude` (a denylist): with an
# allowlist, files added to the crate directory in the future are excluded from the
# published package by default, so nothing is accidentally shipped. With `exclude`,
# new files leak into the package unless someone remembers to exclude them.
#
# Repository-level documentation (docs/, .ai/, design docs) lives at the WORKSPACE
# ROOT, outside this crate's package directory, so it is never packaged regardless.
# This list is defense-in-depth: only source, the manifest, and the crate README ship.
#
# `Cargo.toml` is always included by Cargo. Before the first publish, either copy
# LICENSE-APACHE / LICENSE-MIT into this crate directory and add them here, or rely
# on the SPDX `license` field above (which is the authoritative license declaration).
include = [
    "src/**/*.rs",
    "README.md",
]

[features]
# Exposes the backend conformance harness (`conformance` module) so external
# backend crates can run the ADR-005 contract tests against their own store.
# Enable it as a dev-dependency; it pulls in no extra dependencies and never
# ships in a normal build.
conformance = []

# Observability, OFF by default (ADR-010, ADR-012). Each pillar is additive and
# independent; with both disabled the instrumentation compiles to no-ops with
# negligible overhead on the decision path (NFR-023).
metrics = ["dep:metrics"]
tracing = ["dep:tracing"]

[dependencies]
thiserror = { workspace = true }

# Optional observability pillars. Pulled in only when the matching feature is on,
# so the default build stays lean (thiserror is the only non-optional dependency).
metrics = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

# Capture emitted telemetry in-process to assert on it (redaction, counters,
# labels). Test-only; never part of a shipped build.
metrics-util = { workspace = true }
tracing-subscriber = { workspace = true }
