[package]
name = "flowshield"
version = "0.2.0"
description = "Ergonomic traffic management and rate limiting for Rust — the public facade over flowshield-core."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Packaging allowlist for `cargo publish` (see ADR-003, ADR-018). `include` is an
# allowlist — preferred over `exclude` — so new files are excluded by default.
# Repository documentation lives at the workspace root, outside this package, and is
# never shipped regardless.
include = [
    "src/**/*.rs",
    "README.md",
]

[features]
# Lean default: in-memory storage only (ADR-010). Distributed backends and framework
# integrations are additive opt-ins, declared here as their implementation crates land.
default = ["memory"]

# In-memory storage backend — the default, zero-external-dependency store.
memory = ["dep:flowshield-memory"]

# Distributed backends (ADR-006, ADR-010). Additive and independent: enabling `redis`
# never pulls in `valkey` and vice versa. Each is Tokio-coupled (ADR-016).
redis = ["dep:flowshield-redis"]
valkey = ["dep:flowshield-valkey"]

# Framework integrations (ADR-009, ADR-010). Independent and additive. `axum` also
# enables `tower`, since the Axum integration builds on the Tower layer; `actix` is
# fully standalone (no Tower).
tower = ["dep:flowshield-tower"]
axum = ["dep:flowshield-axum", "tower"]
actix = ["dep:flowshield-actix"]

# Observability, OFF by default (ADR-010, ADR-012). Each is additive and forwards to
# the core crate, where the instrumentation lives (ADR-002). With both off the
# decision path pays negligible overhead (NFR-023).
metrics = ["flowshield-core/metrics"]
tracing = ["flowshield-core/tracing"]

[dependencies]
# The facade re-exports the stable public API from the core crate. Both a version
# (used when published to crates.io) and a path (used inside this workspace) are
# specified so local builds and published builds resolve correctly.
flowshield-core = { version = "0.2", path = "../flowshield-core" }

# The default in-memory backend, forwarded through the `memory` feature above.
flowshield-memory = { version = "0.2", path = "../flowshield-memory", optional = true }

# Distributed backends, forwarded through the `redis` / `valkey` features above.
flowshield-redis = { version = "0.2", path = "../flowshield-redis", optional = true }
flowshield-valkey = { version = "0.2", path = "../flowshield-valkey", optional = true }

# Framework integrations, forwarded through the `tower` / `axum` / `actix` features.
flowshield-tower = { version = "0.2", path = "../flowshield-tower", optional = true }
flowshield-axum = { version = "0.2", path = "../flowshield-axum", optional = true }
flowshield-actix = { version = "0.2", path = "../flowshield-actix", optional = true }

[dev-dependencies]
# Examples run on a real async runtime, the way a service would. Dev-only: never part
# of the published crate (ADR-016 keeps a runtime out of the library itself).
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# The observability example installs a real Prometheus recorder and a `tracing`
# subscriber — the collection/export wiring a host owns (ADR-012). Dev-only.
metrics-exporter-prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Examples use the in-memory backend, so they only build when the `memory` feature is
# on. `required-features` lets `cargo build --no-default-features` skip them cleanly.
[[example]]
name = "background_worker"
required-features = ["memory"]

[[example]]
name = "layered_quotas"
required-features = ["memory"]

# The observability example needs the two telemetry pillars turned on as well.
[[example]]
name = "observability"
required-features = ["memory", "metrics", "tracing"]
