[package]
name = "flowshield-axum"
version = "1.0.0"
description = "Axum integration for FlowShield — per-key rate limiting middleware with 429 + Retry-After."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

include = [
    "src/**/*.rs",
    "README.md",
]

[dependencies]
flowshield-core = { version = "1", path = "../flowshield-core" }
# Axum-idiomatic ergonomics are added on top of the Tower layer (ADR-009), not
# reimplemented — this crate reuses flowshield-tower's Layer/Service.
flowshield-tower = { version = "1", path = "../flowshield-tower" }
# `ConnectInfo` (behind axum's `tokio` feature) for the client-address extractor, and
# the `http` request types. Kept lean — the running server's HTTP features are pulled
# in only for the example (below), not forced on library users.
axum = { version = "0.8", default-features = false, features = ["tokio"] }
http = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
flowshield-memory = { version = "1", path = "../flowshield-memory" }
# `ServiceExt::oneshot` drives the router in the integration test.
tower = { version = "0.5", features = ["util"] }
# The example runs a real HTTP/1 server; those axum features are dev-only.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

[[example]]
name = "axum_server"
