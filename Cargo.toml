[workspace]
resolver = "2"

members = [
    "crates/flowshield",
    "crates/flowshield-core",
    "crates/flowshield-memory",
    "crates/flowshield-resp",
    "crates/flowshield-redis",
    "crates/flowshield-valkey",
    "crates/flowshield-tower",
    "crates/flowshield-axum",
    "crates/flowshield-actix",
    "crates/flowshield-benchmarks",
    "crates/flowshield-e2e",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# Minimum Supported Rust Version (ADR-015, DV-02 — resolved for 1.0). 1.85 is the
# edition-2024 floor and FlowShield's committed source MSRV: all first-party crates
# compile on it, and the default in-memory build is CI-verified against it.
#
# Caveat, documented in docs/COMPATIBILITY.md: enabling the heavy optional features
# (`redis`, `valkey`, `axum`, `actix`) pulls third-party dependency trees whose own MSRV
# is currently higher (~1.88). The effective MSRV of a build is therefore the max of this
# floor and the MSRV of the features you enable. This value governs FlowShield's own code.
rust-version = "1.85"
#
# Shared package metadata, inherited by member crates via `<field>.workspace = true`.
repository = "https://github.com/devcalm/flowshield"
homepage = "https://github.com/devcalm/flowshield"
authors = ["Oleksii Tsvietaiev"]
keywords = ["rate-limiting", "rate-limiter", "throttling", "traffic", "middleware"]
categories = ["network-programming", "web-programming", "asynchronous"]

[workspace.dependencies]
tokio = "1"
thiserror = "2"
proptest = "1"

# Benchmarking harness (ADR-014, Phase 6). Dev/bench-only — never a runtime dependency
# of any library crate; it appears solely in the non-published `flowshield-benchmarks`
# crate. Criterion is chosen for its full-distribution (tail) latency reporting and its
# machine-readable JSON output, both mandated by ADR-014.
criterion = { version = "0.5", features = ["html_reports"] }

# Observability (ADR-012). Optional and OFF by default in every crate that uses
# them; declared here so versions stay aligned across the workspace.
metrics = "0.24"
tracing = "0.1"

# Test/example-only observability tooling — never a runtime dependency of the
# library crates (they appear under `[dev-dependencies]` only).
metrics-util = "0.19"
tracing-subscriber = "0.3"
metrics-exporter-prometheus = "0.18"