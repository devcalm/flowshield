name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# NOTE: There is intentionally no MSRV job. Per ADR-015 (OQ-05), FlowShield does not
# commit to a Minimum Supported Rust Version during the research/architecture phase;
# it develops against current stable. An MSRV check will be added before the 1.0 release.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }} / ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # Beta is informational: allow it to fail without failing the build.
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # Full feature set...
      - run: cargo test --workspace --all-features --locked
      # ...and the minimal build (default = ["memory"] per ADR-010).
      - run: cargo test --workspace --no-default-features --locked

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features --locked

  # Benchmark suite (ADR-014, Phase 6). Shared CI runners are too noisy to gate a
  # numeric performance tolerance without false alarms, so this job does the two checks
  # that ARE reliable on shared hardware: it compiles the whole suite (benchmarks never
  # bit-rot) and runs the scenario binaries (a deadlock, panic, or blown allocation
  # budget fails the build — NFR-004). Numeric regression gating (scripts/bench_regression.py)
  # is intended for a dedicated runner; see docs/benchmarks/methodology.md.
  bench:
    name: benchmarks (build + scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile every benchmark without running the measurement loops.
      - run: cargo bench -p flowshield-benchmarks --benches --no-run --locked
      # Run the deterministic scenario binaries; a panic/deadlock here fails CI.
      - run: cargo run -p flowshield-benchmarks --release --example allocations --locked
      - run: cargo run -p flowshield-benchmarks --release --example concurrency_10k --locked

  # Distributed-backend integration tests against real Redis and Valkey (ADR-006).
  # Service containers run only on Linux runners; the main test matrix (which also
  # compiles these crates) simply skips the reachability-gated tests when no server
  # is present. Here the FLOWSHIELD_REQUIRE_* flags make an unreachable server a hard
  # failure, so the distributed path is genuinely exercised.
  integration:
    name: integration (redis + valkey)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s
          --health-timeout 3s --health-retries 10
    env:
      FLOWSHIELD_REQUIRE_REDIS: "1"
      FLOWSHIELD_REQUIRE_VALKEY: "1"
      FLOWSHIELD_REDIS_URL: "redis://127.0.0.1:6379"
      FLOWSHIELD_VALKEY_URL: "redis://127.0.0.1:6380"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p flowshield-redis -p flowshield-valkey --locked
