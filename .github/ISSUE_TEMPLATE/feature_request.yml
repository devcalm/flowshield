name: Feature request / proposal
description: Suggest a capability or design change for FlowShield.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Significant architectural or API changes are decided via ADRs (see CONTRIBUTING.md).
        For those, describe the problem here; a maintainer may ask for an ADR.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like FlowShield to do? Sketch the API/behavior if you can.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you set them aside.
    validations:
      required: false
  - type: input
    id: related-adr
    attributes:
      label: Related ADR (if any)
      placeholder: e.g. ADR-008 (Algorithms)
    validations:
      required: false
